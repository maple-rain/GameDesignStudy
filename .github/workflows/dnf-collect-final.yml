name: DNF 종료 구간 집중 수집

# 트로피컬 바캉스 패키지는 2026-08-27 06시에 구성품이 일괄 삭제된다.
# 주 수집기(dnf-collect.yml)는 2시간 간격인데, 실제 회차 시각을 보면
# 05:32 다음이 07:29 라서 06시 삭제 시점에 관측점이 없다.
# 삭제된 뒤에는 경매장 조회가 되지 않을 수 있으므로 그 구간은 지금 아니면 못 잰다.
#
# 그래서 대상을 33종으로 좁혀 따로 받는다.
# 주 수집기와 다른 파일(pkg_YYYYMM_final_ci.csv)에 쓰므로 내용 충돌은 없다.
#
# 종료 직전 몇 시간은 크론에 맡기지 않는다. GitHub 은 짧은 주기 크론을 건너뛴다.
# 그 구간은 workflow_dispatch 로 한 번에 길게 돌린다.
#   8/26 18:00 무렵  duration_min=350  interval_sec=300   (5분 간격 약 6시간)
#   8/27 00:00 무렵  duration_min=350  interval_sec=180   (3분 간격 약 6시간)
# 한 잡의 상한이 6시간이라 350분으로 잡았다.
# 3분 간격이라도 33종이면 시간당 660콜, 초당 0.1콜 수준이다.

# 약관 제5조 제8항은 "주기적/지속적인 접속을 시도하여 과부하를 발생시키는" 방식을
# 금지한다. 숫자 상한은 약관에 없고 제4조 제2항이 홈페이지 공지로 정한다고만 한다.
# 그래서 상시 짧은 주기 폴링은 하지 않는다. 필요한 구간만 좁혀서 받는다.
#   8/25 ~ 8/27  30분 간격 (관측이 필요한 사흘)
#   그 밖의 날     아예 돌지 않는다. 주 수집기의 2시간 간격으로 충분하다.
#   종료 직전      수동 실행으로 한 번에 길게 (아래 참고)
# 사흘 30분 간격이면 144회 x 66콜 = 9,504콜이다.

on:
  schedule:
    # UTC 기준. KST 8/25 00:00 ~ 8/28 00:30 을 30분 간격으로 덮는다.
    - cron: "0,30 15-23 24 8 *"
    - cron: "0,30 * 25-26 8 *"
    - cron: "0,30 0-15 27 8 *"
  workflow_dispatch:
    inputs:
      duration_min:
        description: "반복할 시간(분). 0이면 1회만 수집"
        required: false
        default: "0"
      interval_sec:
        description: "수집 간격(초)"
        required: false
        default: "300"

permissions:
  contents: write

# 주 수집기와 그룹을 분리한다. 쓰는 파일이 달라 병행해도 된다.
concurrency:
  group: dnf-collect-final
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      # 종료 후 일주일이면 관측이 끝난다. 그 뒤로는 크론을 헛돌리지 않는다.
      # (수동 실행은 이 검사를 지나간다)
      - name: 기간 확인
        id: window
        run: |
          NOW=$(date -u +%s)
          END=$(date -u -d "2026-09-03 00:00:00" +%s)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$NOW" -gt "$END" ]; then
            echo "관측 기간이 지났다. 건너뛴다."
            echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.window.outputs.run == 'yes'
        with:
          python-version: "3.12"

      - name: 키 확인
        if: steps.window.outputs.run == 'yes'
        run: |
          if [ -z "${{ secrets.DNF_API_KEY }}" ]; then
            echo "::error::DNF_API_KEY 시크릿이 없다."
            exit 1
          fi

      - name: 수집 — 종료 구간 33종
        if: steps.window.outputs.run == 'yes'
        env:
          DNF_API_KEY: ${{ secrets.DNF_API_KEY }}
          FINAL_LOOP_MIN: ${{ github.event.inputs.duration_min || '0' }}
          FINAL_INTERVAL_SEC: ${{ github.event.inputs.interval_sec || '300' }}
        run: python SystemAnalysis/tools/dnf_collect_final.py

      - name: 커밋
        if: steps.window.outputs.run == 'yes'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SystemAnalysis/tools/data
          if git diff --staged --quiet; then
            echo "변화 없음. 커밋하지 않는다."
            exit 0
          fi
          git commit -m "종료 구간 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          # 주 수집기가 같은 시각에 푸시했을 수 있으므로 몇 번 다시 시도한다.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::푸시 실패"
          exit 1
