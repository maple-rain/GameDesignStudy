name: DNF 시세 수집

# 소울 결정 5종의 체결가와 거래 속도를 2시간마다 수집해 저장소에 커밋한다.
# 로컬 작업 스케줄러는 PC가 꺼져 있으면 그 구간을 영영 놓치므로 이쪽을 주 수집기로 둔다.
# 네오플 API는 최근 100건까지만 주기 때문에 놓친 구간은 나중에 채울 수 없다.

on:
  schedule:
    # UTC 기준 2시간마다. KST로는 09:00, 11:00, 13:00 ... 에 해당한다.
    # GitHub 부하에 따라 수 분에서 수십 분까지 밀릴 수 있다. 정시 보장이 아니다.
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

# 앞 실행이 커밋 중일 때 다음 실행이 겹치지 않게 한다.
concurrency:
  group: dnf-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 키 확인
        run: |
          if [ -z "${{ secrets.DNF_API_KEY }}" ]; then
            echo "::error::DNF_API_KEY 시크릿이 없다. Settings > Secrets and variables > Actions 에서 등록할 것."
            exit 1
          fi

      - name: 수집 — 소울 결정 5종
        env:
          DNF_API_KEY: ${{ secrets.DNF_API_KEY }}
          DNF_COLLECT_TAG: "_ci"
        run: python SystemAnalysis/tools/dnf_collect.py

      # 트로피컬 바캉스 패키지는 2026-08-27 점검 전까지만 판매된다.
      # 종료가 다가올 때의 시세는 지금 재지 않으면 복원할 수 없다.
      #
      # 플래티넘 엠블렘 25종을 8/18 에 넣었다가 8/20 에 뺐다.
      # 프리미엄 플래티넘 엠블렘 선택 상자의 값이 무엇에 근거하는지 알아보려고
      # 넣은 것이고 답이 나왔다. 상자 체결 2,190,000 은 유저 선호 엠블렘 하나의
      # 중위값 2,200,000 과 오차 1.7% 다.
      # 엠블렘 자체는 패키지와 무관한 상시 시장 아이템이라 계속 모을 이유가 없다.
      # 선택 상자 2종은 다구매 사다리 보상이므로 남긴다.
      - name: 수집 — 패키지 108종
        env:
          DNF_API_KEY: ${{ secrets.DNF_API_KEY }}
          DNF_COLLECT_TAG: "_ci"
        run: python SystemAnalysis/tools/dnf_collect_pkg.py

      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SystemAnalysis/tools/data
          if git diff --staged --quiet; then
            echo "변화 없음. 커밋하지 않는다."
            exit 0
          fi
          git commit -m "시세 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          # 사람이 같은 시각에 푸시했을 수 있으므로 몇 번 다시 시도한다.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::푸시 실패"
          exit 1
